name: AI Tests

on:
  pull_request:
    branches:
      - candidate/camilo/command-translation

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  tests:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libyaml-dev libegl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 \
            libxcb-cursor0 libjpeg-dev
      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U -r misc/requirements/requirements-tox.txt
      - name: Run AI unit tests
        run: |
          dbus-run-session -- tox -e py312-pyqt66 -- tests/unit/misc/ai/
